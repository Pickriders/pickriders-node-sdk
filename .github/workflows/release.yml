name: Release

on:
  push:
    branches: [main]

concurrency: release

permissions:
  contents: write
  pull-requests: write
  id-token: write # npm provenance

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: yarn
          # No registry-url: it writes an .npmrc with ${NODE_AUTH_TOKEN}, which Yarn 1 can't start
          # without (setup-node runs `yarn cache dir` for the cache). changesets/action writes its own
          # .npmrc from NPM_TOKEN just before publishing.
      - run: yarn install --frozen-lockfile
      # With pending changesets: opens a "Version packages" PR, and merging that publishes.
      # With none: publishes any version not on npm yet (0.1.0 on the first run).
      - uses: changesets/action@v1
        with:
          version: yarn changeset version
          publish: yarn release
          title: 'chore: release'
          commit: 'chore: release'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
