name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # The dev tools (vitest, tsup, lint-staged) need Node 22+. Node 20 users are covered by
    # `package` below, which tests the built package itself.
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: yarn typecheck
      - run: yarn lint
      - run: yarn format:check
      - run: yarn test
      - run: yarn check:package

  package:
    # What users install, on every Node version the SDK supports (engines: >=20).
    name: Built package on Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: yarn
      - run: yarn install --frozen-lockfile
      - name: Build and pack
        run: yarn build && mv "$(npm pack --silent | tail -1)" "$RUNNER_TEMP/pickriders.tgz"
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - name: Install the tarball into an empty project and run the smoke test
        working-directory: ${{ runner.temp }}
        run: |
          mkdir app && cd app
          npm init -y > /dev/null
          npm install --no-audit --no-fund "$RUNNER_TEMP/pickriders.tgz"
          cp "$GITHUB_WORKSPACE/test/compat/built-package.test.mjs" .
          node --test built-package.test.mjs

  sandbox:
    name: Sandbox quickstart
    runs-on: ubuntu-latest
    needs: check
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    env:
      PICKRIDERS_TEST_KEY: ${{ secrets.PICKRIDERS_TEST_KEY }}
      PICKRIDERS_BASE_URL: ${{ vars.PICKRIDERS_BASE_URL }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: yarn
      - run: yarn install --frozen-lockfile
      - name: Run the quickstart against the sandbox (skipped without PICKRIDERS_TEST_KEY)
        run: yarn test:sandbox

  passed:
    # The one check branch protection requires, so the matrices above can change freely.
    name: CI passed
    runs-on: ubuntu-latest
    needs: [check, package]
    if: always()
    steps:
      - name: Every check and package job succeeded
        run: |
          [ "${{ needs.check.result }}" = success ] && [ "${{ needs.package.result }}" = success ] || {
            echo "check: ${{ needs.check.result }}, package: ${{ needs.package.result }}"; exit 1; }
